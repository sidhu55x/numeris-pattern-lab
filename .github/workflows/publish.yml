name: Refresh experiments and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF extractor
        if: github.event_name != 'push'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Refresh official history and score predictions
        if: github.event_name != 'push'
        run: npm run refresh
      - run: npm test
      - name: Preserve new predictions and outcomes
        if: github.event_name != 'push'
        run: |
          git config user.name 'numeris-bot'
          git config user.email 'numeris-bot@users.noreply.github.com'
          git add dist/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh draw history and preserve forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
